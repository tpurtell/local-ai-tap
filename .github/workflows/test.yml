name: Homebrew Linux AMD64 source and bottles

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        install: [bottle, source]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Homebrew/actions/setup-homebrew@c722b5d961eb7f3ebec81ec2e5584faf7c3cff5d
      - name: Install the checked-out tap
        run: |
          brew tap tpurtell/local-ai "$GITHUB_WORKSPACE"
          if brew commands | grep -qx trust; then
            brew trust --tap tpurtell/local-ai
          fi
      - name: Check, build, and test
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          INSTALL_MODE: ${{ matrix.install }}
        run: |
          shopt -s globstar nullglob
          formulae=()
          for file in Formula/**/*.rb; do
            formulae+=("tpurtell/local-ai/$(basename "$file" .rb)")
          done
          brew style "${formulae[@]}"
          brew audit --strict "${formulae[@]}"
          scripts/check-bottles --download
          if [[ "$INSTALL_MODE" == bottle ]]; then
            brew install "${formulae[@]}"
            scripts/check-installed-bottles
          else
            brew install --build-from-source "${formulae[@]}"
          fi
          brew test "${formulae[@]}"
          brew linkage --test "${formulae[@]}"
          scripts/check-bottle-abi "${formulae[@]}"
